name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - uses: jdx/mise-action@v5

      - name: Build with Gradle
        run: make build

      - name: Coverage report
        run: make report

      - uses: coverallsapp/github-action@v2
        with:
          file: build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          # В отчёте jacoco путь к файлу начинается с имени пакета, поэтому
          # корнем для поиска исходников служит src/main/java.
          base-path: src/main/java

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: hexletcomponents/java-javalin-blog:latest
          cache-to: type=inline
          tags: hexletcomponents/java-javalin-blog:latest

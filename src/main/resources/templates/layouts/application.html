<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Javalin Blog</title>
    <link href="/css/main.css" rel="stylesheet">
  </head>

  <body class="flex min-h-screen flex-col bg-gray-50 text-gray-900">
    <nav class="border-b border-gray-200 bg-white">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-6 px-4 py-3">
        <a class="text-sm text-gray-600 hover:text-gray-900" href="/">Главная</a>
        <a class="text-sm text-gray-600 hover:text-gray-900" href="/about">О блоге</a>
        <a class="text-sm text-gray-600 hover:text-gray-900" href="/articles">Статьи</a>
      </div>
    </nav>

    <main class="flex-1">
      <div
        th:if="${session.flash}"
        th:with="type=${ctx.consumeSessionAttribute('flash-type')}"
        th:class="'border-b px-4 py-3 ' + (${type == 'success'} ? 'border-green-200 bg-green-50 text-green-800' : (${type == 'danger'} ? 'border-red-200 bg-red-50 text-red-800' : 'border-sky-200 bg-sky-50 text-sky-800'))"
        role="alert"
      >
        <p class="mx-auto max-w-5xl" th:text="${ctx.consumeSessionAttribute('flash')}"></p>
      </div>
      <div class="mx-auto w-full max-w-5xl px-4 pb-10">
        <h1 class="mt-6 mb-4 text-3xl font-bold">
          <section layout:fragment="header"></section>
        </h1>
        <section layout:fragment="content"></section>
      </div>
    </main>

    <footer class="border-t border-gray-200 bg-white py-4">
      <div class="mx-auto max-w-5xl px-4 text-center text-sm text-gray-600">
        created by
        <a class="text-blue-600 hover:underline" href="https://ru.hexlet.io" target="_blank">Hexlet</a>
      </div>
    </footer>
   </body>

</html>

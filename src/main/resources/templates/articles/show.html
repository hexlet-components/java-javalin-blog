<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/application.html}">

  <section layout:fragment="header">
    Просмотр статьи
  </section>

  <section layout:fragment="content" th:object="${article}">
    <div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
      <div class="border-b border-gray-200 bg-gray-800 px-6 py-4 text-white">
        <h2 class="text-xl font-semibold" th:text="*{getName()}"></h2>
      </div>
      <div class="px-6 py-4">
        <p class="text-lg" th:text="*{getDescription()}"></p>
      </div>
    </div>
  </section>

</html>
